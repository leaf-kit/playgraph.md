[package]
name = "playgraph"
version = "0.1.0"
description = "Interactive math animation viewer powered by markdown"
authors = ["leaf-kit"]
license = "MIT"
repository = "https://github.com/leaf-kit/playgraph.md"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "playgraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
notify = "8"
notify-debouncer-mini = "0.6"
pulldown-cmark = "0.12"
walkdir = "2"
regex = "1"
include_dir = "0.7.4"

[dev-dependencies]
tempfile = "3"
